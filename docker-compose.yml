services:
  horizon-mariadb:
    image: mariadb:10.11
    container_name: horizon-mariadb
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=horizon_root
      - MYSQL_DATABASE=horizon
      - MYSQL_USER=horizon
      - MYSQL_PASSWORD=horizon
    volumes:
      - horizon_mariadb_data:/var/lib/mysql
    networks:
      - horizon-internal
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/3306"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s

  horizon-redis:
    image: redis:7-alpine
    container_name: horizon-redis
    restart: unless-stopped
    volumes:
      - horizon_redis_data:/data
    networks:
      - horizon-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  appwrite:
    image: appwrite/appwrite:latest
    container_name: horizon-appwrite
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - APPWRITE_DB_HOST=horizon-mariadb
      - APPWRITE_DB_PORT=3306
      - APPWRITE_DB_SCHEMA=horizon
      - APPWRITE_DB_USER=horizon
      - APPWRITE_DB_PASS=horizon
      - APPWRITE_REDIS_HOST=horizon-redis
      - APPWRITE_REDIS_PORT=6379
    volumes:
      - appwrite_data:/var/lib/appwrite
    depends_on:
      horizon-mariadb:
        condition: service_healthy
      horizon-redis:
        condition: service_healthy
    networks:
      - horizon-internal
      - npm-network

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: horizon-web
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - NEXT_PUBLIC_SITE_URL=http://192.168.4.110:3000
    ports:
      - "3000:3000"
    depends_on:
      - appwrite
    networks:
      - horizon-internal
      - npm-network

volumes:
  horizon_mariadb_data:
  horizon_redis_data:
  appwrite_data:

networks:
  horizon-internal:
    driver: bridge
  npm-network:
    external: true
    name: npm-network
